## 继承自 v2.4 且在 Stage 1 继续适用的硬约束

- **backend invariant**：两臂（MCQ 与 H1）必须使用同一推理后端（当前 = 本地 8-bit）。
  §6 的 gate 是 D = S_MCQ − S_H1；两臂后端不同 → S 之差分不清是 observability 差异
  还是量化差异，gate 失去意义。若改用远程算力换精度，**两臂都要换**，且 G3/G4 须重挣。
- **一次性揭盲**（v2.4 §2.2 逐字适用）：全量冻结后分析只跑一次，每次调用留可审计记录，
  rerun 须显式标注，不得替换已发布的 confirmatory 结果。
  Stage 1 产物目录 `outputs/stage1/`，与 `outputs/stage0/` 完全隔离；
  **绝不触碰** Stage 0 的 freeze manifest / unblinding log / analysis report。
- **扩容承诺**：N、K 一经冻结不得追加。若精度不足，如实记 inconclusive；
  §10 的 E1 预期区间跨越 0.04 是有意的，实测落在区间外**不算协议失败**，
  也不得触发追加样本、修改 N/F/R/B_per_batch 或重跑择优。
