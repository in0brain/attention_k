## hash_mode（2026-08-08 补，**不 bump version**）

    定义  bytes → UTF-8 **strict** decode → CRLF 与裸 CR 统一为 LF
                → UTF-8 encode → SHA-256

    为什么需要：本仓库 core.autocrlf=true 且无 .gitattributes，
    preregistration_v3.md 在本机是全 CRLF（1416 行）。Linux checkout 会得到 LF，
    原始字节口径下 hash 立刻改变 —— **内容一字未动却触发 G2**。那是假警报，
    而假警报会训练人去忽略 gate，比没有 gate 更糟。

    只规范化行尾，**别的一概不动**：尾随空格、缩进、空行增删、最末换行的有无
    仍然改变哈希。多规范化一样东西，就多一种能掩盖真实改动的途径。
    BOM **不静默剥离**，检测到即具名报错（文件被别的编辑器重存过 = 需要人工确认）。

    为什么不 bump version：**被冻结的内容一字未改**，改的只是指纹的计算方式。
    它不改判读规则、不改样本、不改假设空间、不指向任何结论方向；§10 不重开。
    与 v2.4 当年补 backend invariant 而不 bump 属同一类处理。

    历史留痕（原始字节口径，2026-08-08 冻结当刻的值，**已停用**）：
        raw-bytes digest 01df52e4c5cb77f9cb97843ddd0103a20e0d7e673a0f1ecd5435f35ebb1b2287
    两者对应**同一份内容**：前者含 CRLF，后者为其 LF 规范化形式。

本 lock 与 `preregistration.lock`（v2.4，Stage 0）**并存，互不覆盖**。
两份设计权威并存是有意的：正文报 Stage 1，附录报 Stage 0 及其教训，各自可独立校验。
v2.4 的 lock 保持原样；本文件只管 Stage 1。

## 强制程度（**如实陈述，不得夸大** —— 见 preregistration_v3 §12.1）

    ✔ 已有  本 lock（记录 v3.0 的指纹）
            evaluation/v3_freeze.py::{check_v3_frozen, require_v3_frozen}
            tests/test_v3_freeze.py 的"篡改即拒"回归测试
    ❌ 尚无  Stage 1 的 preflight / sample-builder / generation 入口
            → 目前**没有任何生产路径在调用 G2**

    ⇒ 现状 = **文件级冻结 + 可调用的校验函数**，**不是端到端强制**。
      不得声称"v3 的冻结已由代码端到端强制"。
      （v2.4 的同款教训："由代码强制，不只写在 lock —— 散文会悄悄漂移。"）

## 冻结后的执行顺序（固定，不得跳步）

    v3 lock
    → Stage 1 入口 + G2/G5 接线        ← 下一 sprint 必须先做这一步
    → 正式样本名单物化与互斥审计        ← 在 G2 接线之前**不得**物化名单
    → G3 smoke（≤20 prompt 真实模型）
    → G4 性能盲质量检查
    → 正式生成

## 规则

- 本 hash 是冻结后 `preregistration_v3.md` 内容的指纹。任何 Stage 1 入口在启动前
  必须重算并与本值比对，不一致则停（防止跑后改判读规则/定义）。
- 冻结后不再改设计。若确需修改：先 bump version（v3.1…）、重算 hash、更新本文件，
  并在 preregistration_v3 顶部状态段记录变更；不得静默改动。
- **G3 / G4 / G5 须按 v3 重挣**：三者的校验均含 `prereg_sha256`，
  v2.4 的旧 report 会被自动拒。G3 需真实模型 smoke（≤20 prompt），属独立一轮。
- 本 lock 不参与被冻结文件的 sha256；本文件的散文改动不改变 gate 结果。
  因此**凡需强制的东西都必须落到代码**：F / 两个 salt / population 已进
  `v3_config.FROZEN_FIELDS`，由 `assert_production` 逐项精确核对。

